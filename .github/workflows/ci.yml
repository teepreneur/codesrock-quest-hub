name: CI

# Runs on every pull request and on pushes to main, so problems are caught
# before (and right after) anything reaches production.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codesrock-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codesrock-backend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codesrock-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codesrock-frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid
